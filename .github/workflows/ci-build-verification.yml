name: CI Build Verification

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-verification:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verification
        run: mvn -B verify

      - name: Run mutation coverage
        run: mvn -B pitest:mutationCoverage
